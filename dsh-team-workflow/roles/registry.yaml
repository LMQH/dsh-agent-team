notes:
  - "本注册表的 10 个 local-definition 与 5 个 dsh-builtin-substitute 之和等于源 team-workflow 角色表的 15 个角色；不得把 10 份专属角色文件误报为 15 份。"
  - "spawns: false 对所有角色均为合同声明（源文件中 10 个角色均为 spawns: false）。DSH 是否可按成员禁用 spawn 工具未经验证，本包不作强制声明。"
  - "hermes-obsidian 在 10 个本地角色中均被源定义为自动加载技能；其 vault 流程在知识库未配置前处于惰性状态（inert），见各角色文件的『知识库（vault）访问规则』。"
  - "write_scopes 只是 advisory 提示，DSH 不自动强制、不阻止重叠写入；DSH 也不自动释放任务所有权，不提供按角色的 OS 沙箱。"
